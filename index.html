<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELARQUE | AI Creative Studio for Skincare and Beauty Brands</title>
    <meta
      name="description"
      content="AI creative studio for skincare and beauty brands: art-directed ads, Reels, social designs and landing pages. Request a free 3-concept sample."
    />

    <!-- Canonical URL (TODO: Sync with SITE_URL in src/config.ts) -->

    <!-- Favicon (SVG + 32px PNG fallback) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='2' fill='%23F4EFE8'/%3E%3Cpath d='M23 7H14a7 7 0 0 0-7 7v4a7 7 0 0 0 7 7h5M8 16h9' stroke='%232B2420' stroke-width='2.2' fill='none' stroke-linecap='square'/%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ELARQUE" />
    <meta property="og:url" content="https://elarque.studio/" />
    <meta property="og:title" content="ELARQUE | AI Creative Studio for Skincare and Beauty Brands" />
    <meta
      property="og:description"
      content="AI creative studio for skincare and beauty brands: art-directed ads, Reels, social designs and landing pages. Request a free 3-concept sample."
    />
    <meta property="og:image" content="/src/assets/images/study_collection_wide_1795194804789.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Minimalist amber, alabaster, and sage skincare vessels on a warm travertine shelf art-directed by ELARQUE"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ELARQUE | AI Creative Studio for Skincare and Beauty Brands" />
    <meta
      name="twitter:description"
      content="AI creative studio for skincare and beauty brands: art-directed ads, Reels, social designs and landing pages. Request a free 3-concept sample."
    />
    <meta name="twitter:image" content="/src/assets/images/study_collection_wide_1795194804789.jpg" />

    <!-- Google Fonts: Cormorant Garamond & Instrument Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization & Services -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "ELARQUE",
            "url": "https://elarque.studio",
            "description": "AI creative studio for skincare and beauty brands, producing art-directed ads, Reels, social designs and landing pages."
          },
          {
            "@type": "Service",
            "name": "AI Advertising Creative Pack",
            "provider": {
              "@type": "Organization",
              "name": "ELARQUE"
            },
            "description": "5 AI product advertising images, 2 social media promotional designs, 1 revision round, delivered in 3-5 working days.",
            "offers": {
              "@type": "Offer",
              "priceSpecification": {
                "@type": "PriceSpecification",
                "minPrice": "79",
                "maxPrice": "99",
                "priceCurrency": "USD"
              }
            }
          },
          {
            "@type": "Service",
            "name": "Landing Page Package",
            "provider": {
              "@type": "Organization",
              "name": "ELARQUE"
            },
            "description": "One responsive landing page with product or service presentation, WhatsApp or contact integration, basic SEO setup, and one revision round.",
            "offers": {
              "@type": "Offer",
              "priceSpecification": {
                "@type": "PriceSpecification",
                "minPrice": "149",
                "maxPrice": "249",
                "priceCurrency": "USD"
              }
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
